name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doctest-dev
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFLIGHT_LOG_BUILD_EXAMPLES=ON
          -DFLIGHT_LOG_ENABLE_UNIT_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test installation
        run: |
          prefix="$RUNNER_TEMP/flight-log-install"
          cmake --install build --prefix "$prefix"
          test -s "$prefix/share/doc/flight-log-inspector/LICENSE"
          "$prefix/bin/flight-log-inspector" --summary-only tests/log_files/sample_log_small.ulg > /dev/null
